name: Daily Tech Digest

on:
  schedule:
    # Runs every day at 9:00 AM UTC (adjust to your timezone)
    - cron: "0 9 * * *"
  workflow_dispatch:
    # Allows manual trigger from GitHub UI
    inputs:
      dry_run:
        description: "Dry run (fetch only, no delivery)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  digest:
    name: Generate and Deliver Digest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v --tb=short

      - name: Run digest
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ secrets.DIGEST_GITHUB_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVOLUTION_API_URL: ${{ secrets.EVOLUTION_API_URL }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          WHATSAPP_RECIPIENT_NUMBER: ${{ secrets.WHATSAPP_RECIPIENT_NUMBER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          RERANK_MODEL: ${{ vars.RERANK_MODEL }}
          RERANK_POOL_SIZE: ${{ vars.RERANK_POOL_SIZE }}
          RERANK_TOP_N: ${{ vars.RERANK_TOP_N }}
          MIN_IMPORTANCE: ${{ vars.MIN_IMPORTANCE }}
        run: python -m src.main

      - name: Dry run (fetch + rerank, no delivery)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          PYTHONUNBUFFERED: "1"
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          RERANK_MODEL: ${{ vars.RERANK_MODEL }}
          RERANK_POOL_SIZE: ${{ vars.RERANK_POOL_SIZE }}
          RERANK_TOP_N: ${{ vars.RERANK_TOP_N }}
          MIN_IMPORTANCE: ${{ vars.MIN_IMPORTANCE }}
        run: |
          python -c "
          from src.main import run_digest
          articles = run_digest()
          print(f'\n=== Final {len(articles)} articles ===')
          for a in articles:
              imp = a.get('importance', '?')
              rr = a.get('rerank_score', '?')
              print(f'  imp={imp} rerank={rr} | {a[\"title\"]}')
          "
